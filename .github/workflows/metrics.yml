name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: frangelbarrera
          template: classic
          base: header, community, repositories, metadata
          config_timezone: America/Havana # Ajusta a tu zona horaria
          plugin_languages: yes
          plugin_languages_ignored: html, css # Ignora lenguajes simples para resaltar los core
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes
          
